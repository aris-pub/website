[build]
  publish = "_site"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/arch"
  to = "/arch/1.0/"
  status = 302

[[redirects]]
  from = "/arch/"
  to = "/arch/1.0/"
  status = 302

# rsmify: read an arXiv paper rendered through RSM. Edit arxiv.org/abs/<id> to
# aris.pub/r/<id>. A 302 redirect, not a proxy, because a cold conversion can
# exceed Netlify's proxy timeout; the service runs on syenite behind the
# Tailscale funnel.
[[redirects]]
  from = "/r/*"
  to = "https://syenite.tail380acb.ts.net/r/:splat"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"